name: E2E
# The Playwright suite (e2e/*.spec.ts) against the production build served by vite preview, in Chromium on software GL
# (SwiftShader), as playwright.config.ts sets up: the judge path, Cook Mode timing, wipe, reduced motion, phone layouts,
# offline shell, accessibility (axe) and tab order.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  playwright:
    name: playwright (chromium, software GL)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
      - name: npm run e2e
        run: npx playwright test --reporter=list,html 2>&1 | tee e2e.log
      - name: Summary
        if: always()
        run: |
          {
            echo "### Playwright"
            echo '```'
            sed -E 's/\x1b\[[0-9;]*m//g' e2e.log | grep -E '^ *[0-9]+ (passed|failed|flaky|skipped|did not run)' || echo "no summary line (the run did not finish)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
