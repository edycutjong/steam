name: Quality
# Lighthouse CI on the three judge-facing pages of the production build (/, /landing/, /deck/; budgets in
# lighthouserc.json, median of 3 mobile runs), and a gzip budget for the code they load (scripts/bundle-budget.ts).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Scoped package on purpose: the unscoped `lhci` name on npm is not the Lighthouse CI project.
      - name: lhci autorun (@lhci/cli 0.16.1)
        run: npx --yes @lhci/cli@0.16.1 autorun
      - name: Summary
        if: always()
        run: |
          # shellcheck disable=SC2016  # the single-quoted block is JavaScript; its ${...} are template literals
          if compgen -G ".lighthouseci/lhr-*.json" > /dev/null; then
            node -e '
              const fs = require("node:fs");
              const by = {};
              for (const f of fs.readdirSync(".lighthouseci").filter((x) => /^lhr-.*\.json$/.test(x))) {
                const r = JSON.parse(fs.readFileSync(".lighthouseci/" + f, "utf8"));
                (by[new URL(r.finalDisplayedUrl).pathname] ??= []).push(r);
              }
              const med = (a) => a.slice().sort((x, y) => x - y)[Math.floor(a.length / 2)];
              const rows = Object.entries(by).sort().map(([p, rs]) => {
                const s = (k) => Math.round(med(rs.map((r) => r.categories[k].score)) * 100);
                const a = (k, d) => med(rs.map((r) => r.audits[k].numericValue));
                return `| ${p} | ${s("performance")} | ${s("accessibility")} | ${s("best-practices")} | ${s("seo")} | ${Math.round(a("largest-contentful-paint"))} ms | ${Math.round(a("total-blocking-time"))} ms | ${a("cumulative-layout-shift").toFixed(3)} |`;
              });
              console.log(["### Lighthouse (median of 3 runs, mobile emulation)", "", "| page | perf | a11y | best practices | SEO | LCP | TBT | CLS |", "|---|---:|---:|---:|---:|---:|---:|---:|", ...rows].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true # .lighthouseci is a dot-directory, which upload-artifact skips by default
          retention-days: 14
          if-no-files-found: warn

  bundle:
    name: bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run budget
